<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — SonicClean</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#0F2E2B',
          brand: { DEFAULT: '#1F7A6C', light: '#E8F3F0', dark: '#153F38' },
          coral: '#FF6F4E',
          sand: '#F7F9F8'
        },
        fontFamily: {
          display: ['Prompt', 'sans-serif'],
          body: ['Sarabun', 'sans-serif']
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Sarabun', sans-serif; }
  h1, h2, h3, .font-display { font-family: 'Prompt', sans-serif; }
</style>
</head>
<body class="bg-sand text-ink antialiased min-h-screen">

  <header class="sticky top-0 z-50 bg-sand/90 backdrop-blur border-b border-ink/10">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 h-16 flex items-center justify-between">
      <span class="font-display font-700 text-xl tracking-tight">Sonic<span class="text-brand">Clean</span></span>
      <a href="index.html" class="text-sm text-ink/60 hover:text-ink transition-colors">← กลับหน้าสินค้า</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 sm:px-8 py-10 sm:py-14">
    <div class="flex flex-wrap items-end justify-between gap-4 mb-8">
      <div>
        <h1 class="font-display font-700 text-2xl sm:text-3xl mb-1">รายการสั่งซื้อสินค้า (Admin Dashboard)</h1>
        <p class="text-ink/50 text-sm">ดึงข้อมูลคำสั่งซื้อล่าสุดจาก Google Sheets</p>
      </div>
      <div class="flex items-center gap-2">
        <a id="sheetLink" href="#" target="_blank" rel="noopener"
           class="inline-flex items-center gap-2 border border-ink/15 hover:bg-white text-ink/70 text-sm font-medium px-4 py-2.5 rounded-full transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>
          เปิด Google Sheet
        </a>
        <button id="refreshBtn" class="inline-flex items-center gap-2 bg-brand hover:bg-brand-dark text-white text-sm font-medium px-4 py-2.5 rounded-full transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          รีเฟรชข้อมูล
        </button>
      </div>
    </div>

    <!-- Summary cards -->
    <div class="grid sm:grid-cols-3 gap-4 mb-8">
      <div class="bg-white rounded-2xl border border-ink/10 p-5">
        <p class="text-ink/50 text-xs mb-1">คำสั่งซื้อทั้งหมด</p>
        <p id="totalOrders" class="font-display font-700 text-2xl">–</p>
      </div>
      <div class="bg-white rounded-2xl border border-ink/10 p-5">
        <p class="text-ink/50 text-xs mb-1">ยอดขายรวม</p>
        <p id="totalRevenue" class="font-display font-700 text-2xl">–</p>
      </div>
      <div class="bg-white rounded-2xl border border-ink/10 p-5">
        <p class="text-ink/50 text-xs mb-1">อัปเดตล่าสุด</p>
        <p id="lastUpdated" class="font-display font-700 text-2xl">–</p>
      </div>
    </div>

    <!-- Orders table -->
    <div class="bg-white rounded-2xl border border-ink/10 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead>
            <tr class="border-b border-ink/10 text-ink/50 text-xs uppercase-none">
              <th class="px-5 py-3.5 font-medium">วันที่/เวลา</th>
              <th class="px-5 py-3.5 font-medium">ชื่อ-นามสกุล</th>
              <th class="px-5 py-3.5 font-medium">เบอร์โทรศัพท์</th>
              <th class="px-5 py-3.5 font-medium">ที่อยู่จัดส่ง</th>
              <th class="px-5 py-3.5 font-medium text-right">ยอดชำระ</th>
            </tr>
          </thead>
          <tbody id="ordersBody" class="divide-y divide-ink/5">
            <tr>
              <td colspan="5" class="px-5 py-10 text-center text-ink/40">กำลังโหลดข้อมูล...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    // ===== ตั้งค่าการเชื่อมต่อ Google Sheet =====
    // 1. วาง Web App URL จาก Google Apps Script ตรงนี้ (ต้องเป็น URL เดียวกับใน buy.html)
    const scriptURL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    // 2. (ไม่บังคับ) วางลิงก์ Google Sheet ต้นฉบับตรงนี้ เพื่อให้แอดมินกดเปิดดูข้อมูลดิบได้
    const sheetURL = "PASTE_YOUR_GOOGLE_SHEET_LINK_HERE";

    const ordersBody = document.getElementById('ordersBody');
    const totalOrders = document.getElementById('totalOrders');
    const totalRevenue = document.getElementById('totalRevenue');
    const lastUpdated = document.getElementById('lastUpdated');
    const refreshBtn = document.getElementById('refreshBtn');

    function renderEmpty(message) {
      ordersBody.innerHTML = '<tr><td colspan="5" class="px-5 py-10 text-center text-ink/40">' + message + '</td></tr>';
    }

    function renderOrders(orders) {
      if (!orders || orders.length === 0) {
        renderEmpty("ยังไม่มีคำสั่งซื้อเข้ามา");
        totalOrders.textContent = "0";
        totalRevenue.textContent = "0 ฿";
        return;
      }

      ordersBody.innerHTML = orders.map(function (order) {
        return '<tr class="hover:bg-sand/60">' +
          '<td class="px-5 py-3.5 whitespace-nowrap text-ink/60">' + (order.timestamp || '-') + '</td>' +
          '<td class="px-5 py-3.5 font-medium">' + (order.fullname || '-') + '</td>' +
          '<td class="px-5 py-3.5 text-ink/70">' + (order.phone || '-') + '</td>' +
          '<td class="px-5 py-3.5 text-ink/70 max-w-xs truncate">' + (order.address || '-') + '</td>' +
          '<td class="px-5 py-3.5 text-right font-medium text-brand">' + (order.price || 590) + ' ฿</td>' +
          '</tr>';
      }).join('');

      totalOrders.textContent = orders.length;
      const revenue = orders.reduce(function (sum, o) { return sum + (Number(o.price) || 590); }, 0);
      totalRevenue.textContent = revenue.toLocaleString('th-TH') + ' ฿';
    }

    function loadOrders() {
      renderEmpty("กำลังโหลดข้อมูล...");

      fetch(scriptURL, { method: 'GET' })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          renderOrders(data);
          lastUpdated.textContent = new Date().toLocaleTimeString('th-TH');
        })
        .catch(function (err) {
          console.error(err);
          renderEmpty("ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบ scriptURL");
        });
    }

    document.getElementById('sheetLink').href = sheetURL;
    refreshBtn.addEventListener('click', loadOrders);
    loadOrders();
  </script>

</body>
</html>
