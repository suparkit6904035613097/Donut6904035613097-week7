<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า - SonicClean</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <main class="max-w-2xl mx-auto px-4 py-8 sm:py-12">
    <!-- ปุ่มย้อนกลับ -->
    <a href="index.html" class="inline-flex items-center gap-2 text-sm font-medium text-slate-500 hover:text-sky-600 transition-colors mb-6">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
      กลับหน้าสินค้า
    </a>

    <!-- สรุปรายการสั่งซื้อ -->
    <div class="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200/80 shadow-sm mb-6">
      <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3 mb-4">
        สรุปรายการคำสั่งซื้อ
      </h2>
      <div class="flex items-center justify-between gap-4">
        <div>
          <p class="font-semibold text-slate-900 text-base">แปรงสีฟันไฟฟ้า SonicClean</p>
          <p class="text-xs text-slate-500 mt-0.5">รวมหัวแปรงพรีเมียม + สายชาร์จ USB (ส่งฟรีทั่วไทย)</p>
        </div>
        <div class="text-right">
          <p class="text-xl font-bold text-sky-600">฿590</p>
          <span class="text-xs text-slate-400 line-through">฿1,290</span>
        </div>
      </div>
    </div>

    <!-- ฟอร์มกรอกข้อมูล -->
    <div class="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200/80 shadow-sm">
      <h2 class="text-lg font-bold text-slate-900 mb-4">ข้อมูลสำหรับจัดส่ง</h2>

      <form id="orderForm" class="space-y-4">
        <div>
          <label for="fullName" class="block text-sm font-medium text-slate-700 mb-1">ชื่อ - นามสกุล *</label>
          <input 
            type="text" 
            id="fullName" 
            name="fullName" 
            required 
            placeholder="เช่น สมชาย ใจดี" 
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 text-sm transition-all"
          >
        </div>

        <div>
          <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">เบอร์โทรศัพท์ติดต่อ *</label>
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            required 
            placeholder="เช่น 0812345678" 
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 text-sm transition-all"
          >
        </div>

        <div>
          <label for="address" class="block text-sm font-medium text-slate-700 mb-1">ที่อยู่สำหรับจัดส่งสินค้า *</label>
          <textarea 
            id="address" 
            name="address" 
            rows="3" 
            required 
            placeholder="บ้านเลขที่, หมู่, ถนน, ตำบล/แขวง, อำเภอ/เขต, จังหวัด, รหัสไปรษณีย์" 
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 text-sm transition-all resize-none"
          ></textarea>
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full mt-4 py-3.5 px-4 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-xl shadow-md shadow-sky-600/20 hover:shadow-none transition-all flex items-center justify-center gap-2"
        >
          <span>ยืนยันการสั่งซื้อ</span>
        </button>
      </form>
    </div>
  </main>

  <!-- เรียกใช้ไฟล์ JS ส่วนกลางไฟล์เดียวเท่านั้น -->
  <script src="script.js"></script>
</body>
</html>
